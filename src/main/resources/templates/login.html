<!doctype html>
<html lang="zh" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>流调文档协作系统</title>
</head>
<body>
    <p>提示：请下列数据只输入其中一种，其他地方清空</p> <button onclick="clearin()">清空</button> <br>

    <p>通过 id 查找</p> <input type="text" name="id" id="input_id"><br>
    <p>通过 userName 查找</p><input type="text" name="userName" id="input_username"><br>
    <p>通过 name 查找</p><input type="text" name="name" id="input_name"><br>
    <p>通过 teleNum 查找</p><input type="text" name="teleNum" id="input_teleNum"><br>

    <button onclick="sub()">获取</button>

    <p>用户id:</p> <p id="userid"></p> <br>
    <p>userName:</p> <p id="userName"></p> <br>
    <p>name:</p> <p id="name"></p> <br>
    <p>teleNum:</p> <p id="teleNum"></p> <br>

    <script th:src="@{/js/jquery-3.0.0.min.js}"></script>
    <script>
        function clearin() {
            document.getElementById("input_id").value = "";
            document.getElementById("input_username").value = "";
            document.getElementById("input_name").value = "";
            document.getElementById("input_teleNum").value = "";

            document.getElementById("userid").innerHTML = "";
            document.getElementById("userName").innerHTML = "";
            document.getElementById("name").innerHTML = "";
            document.getElementById("teleNum").innerHTML = "";
        }

        function sub() {
            var id = document.getElementById("input_id").value; if(id==='') id=0;
            var username = document.getElementById("input_username").value;
            var name = document.getElementById("input_name").value;
            var telenum = document.getElementById("input_teleNum").value;

            sdata = {
                "id" : id,
                "userName": username,
                "role": "","gentle":0,"passWord":"",
                "name": name,"createDate":new Date(),
                "teleNum": telenum, "isOnline":0
            };

            $.ajax({
                type: "post",
                dataType: "json",
                url: '/MPCDSEPC/api/account/select',
                data:sdata,
                 "Content-Type":"application/json",
                success: function (result) {
                    document.getElementById("userid").innerHTML = result.id;
                    document.getElementById("userName").innerHTML = result.userName;
                    document.getElementById("name").innerHTML = result.name;
                    document.getElementById("teleNum").innerHTML = result.teleNum;
                }
            });
        }
    </script>
</body>
</html>
